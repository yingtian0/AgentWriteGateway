apiVersion: execution.themisy.io/v1alpha1
kind: ServiceContract
metadata:
  name: identity-api
  owner: identity-team
  repository: github.com/example/themisy-demo
  riskTier: high
environments:
  staging:
    releaseProfile: ecs-rolling-standard
    runnerGroup: staging-ap-northeast-1
    capabilities: [deploy, get_status, verify_runtime, rollback]
  production:
    releaseProfile: ecs-rolling-standard
    runnerGroup: production-ap-northeast-1
    capabilities: [deploy, get_status, verify_runtime, rollback]
dependencies: []
verification:
  profile: standard-http-api
  observationWindow: 5m
  checks:
    - type: error-rate
      threshold: < 1%
rollback:
  capability: automatic
  strategy: previous-task-definition
  deadline: 30m
