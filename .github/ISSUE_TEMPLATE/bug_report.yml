name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not disclose security vulnerabilities here; use the private process in SECURITY.md.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched for an existing issue.
          required: true
        - label: This report does not contain credentials, tenant data, or non-public vulnerability details.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide deterministic steps and synthetic input where possible.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Did this affect authorization, ordering, idempotency, audit, verification, rollback, credentials, or another invariant?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Go version, deployment mode, and relevant component versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, tokens, customer identifiers, and personal data.
      render: shell
