name: Feature request
description: Propose a capability or design improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before prescribing an implementation. Trust Boundary, public protocol, durable state, and cryptographic changes require an ADR.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and ADRs.
          required: true
        - label: This request does not require arbitrary shell, arbitrary HTTP, or a generic cloud API proxy.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what outcome is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the smallest typed, testable capability that solves the problem.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Trust and data boundaries
      description: Identify subjects, credentials, policy, evidence, state, and external systems involved.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure behavior
      description: Explain safe behavior for unavailable dependencies, retries, missing evidence, cancellation, and partial completion.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing adapters, workflows, or operational processes that might solve the problem.
