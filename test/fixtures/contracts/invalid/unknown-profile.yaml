apiVersion: execution.agentwritegateway.io/v1alpha1
kind: ServiceContract
metadata:
  name: unknown-profile
  owner: fixture-team
  repository: github.com/example/fixtures
  riskTier: medium
environments:
  staging:
    releaseProfile: does-not-exist
    runnerGroup: staging
    capabilities: [deploy, get_status, verify_runtime, rollback]
verification:
  profile: standard
  observationWindow: 1m
  checks: [{type: health, threshold: healthy}]
rollback:
  capability: automatic
  strategy: previous-version
  deadline: 30m
