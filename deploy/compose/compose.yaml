services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: agentwritegateway
      POSTGRES_PASSWORD: agentwritegateway
      POSTGRES_DB: agentwritegateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentwritegateway -d agentwritegateway"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.6.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agentwritegateway
      POSTGRES_PWD: agentwritegateway
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"

  gateway:
    image: golang:1.26.6-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/gateway", "-config", "config/gateway.example.yaml", "-mode", "gateway"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      AWG_DATABASE_URL: postgres://agentwritegateway:agentwritegateway@postgres:5432/agentwritegateway?sslmode=disable
      AWG_TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    volumes:
      - ../..:/workspace

  worker:
    image: golang:1.26.6-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/gateway", "-config", "config/gateway.example.yaml", "-mode", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      AWG_DATABASE_URL: postgres://agentwritegateway:agentwritegateway@postgres:5432/agentwritegateway?sslmode=disable
      AWG_TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ../..:/workspace

  runner:
    image: golang:1.26.6-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/runner", "-config", "config/runner.example.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWG_RUNNER_DATABASE_URL: postgres://agentwritegateway:agentwritegateway@postgres:5432/agentwritegateway?sslmode=disable
    ports:
      - "8081:8081"
    volumes:
      - ../..:/workspace

volumes:
  postgres-data:
