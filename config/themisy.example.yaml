mode: all
http:
  address: ":8080"
database:
  url: postgres://themisy:themisy@localhost:5432/themisy?sslmode=disable
  auto_migrate: true
temporal:
  address: localhost:7233
  namespace: default
  task_queue: themisy-releases
planning:
  contracts: examples/contracts
  profiles: examples/profiles
grants:
  issuer: https://control-plane.example.invalid
  ttl: 5m
  signing:
    # Development requires a pre-provisioned mode-0600 base64 Ed25519 seed.
    # Production should use provider: aws-kms and an asymmetric Ed25519 KMS key.
    provider: development
    key_id: development-grant-key
    private_key_file: /run/secrets/themisy-grant-ed25519
runner_transport:
  registrations:
    - runner_id: runner-local-1
      tenant_id: tenant-development
      runner_group: local-development
      token_file: /run/secrets/themisy-runner-token
